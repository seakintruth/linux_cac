name: 'CI'

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Shellcheck
        run: sudo apt install -y shellcheck

      - name: Run ShellCheck with -x flag
        run: shellcheck -x cac_setup.sh

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install fakeroot (used by root_check tests)
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Run test suite
        run: bash tests/run_tests.sh -v
