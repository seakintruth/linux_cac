---
- name: Clone CAC lab VMs from cloud-init templates
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../matrix.yml
  tasks:
    - name: Clone each matrix guest
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_token_id }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        node: "{{ proxmox_node }}"
        clone: "{{ item.template_vmid }}"
        vmid: "{{ hostvars[item.name].vm_id | default(omit) }}"
        name: "{{ item.name }}"
        storage: "{{ proxmox_storage }}"
        format: qcow2
        timeout: 300
        state: present
      loop: "{{ combinations }}"
      when: item.status != 'unsupported'
      loop_control:
        label: "{{ item.name }}"

    - name: Start guests
      community.proxmox.proxmox_kvm:
        api_host: "{{ proxmox_api_host }}"
        api_user: "{{ proxmox_api_user }}"
        api_token_id: "{{ proxmox_token_id }}"
        api_token_secret: "{{ proxmox_token_secret }}"
        validate_certs: "{{ proxmox_validate_certs }}"
        node: "{{ proxmox_node }}"
        vmid: "{{ hostvars[item.name].vm_id | default(omit) }}"
        name: "{{ item.name }}"
        state: started
      loop: "{{ combinations }}"
      when: item.status != 'unsupported'
